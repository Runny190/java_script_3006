<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="hw.css">
</head>
<body>
    <input type="number" id="v1" placeholder="please Enter value1">
    <input type="number" id="v2" placeholder="please Enter value2">
    <p id="total"></p>
    <button onclick="Multiply()">+</button>
    <button onclick="Divide()">/</button>
    <button onclick="Modulus()">%</button>

    <script>
        function Multiply() {
            let v1 = document.getElementById('v1').value;
            let v2 = document.getElementById('v2').value;
            console.log(v1,v2);

            let result = Number(v1) * Number(v2);
            document.getElementById('total').innerHTML = result;
        }
    </script>

    <script>
        function Divide() {
            let v1 = document.getElementById('v1').value;
            let v2 = document.getElementById('v2').value;
            console.log(v1,v2);

            let result = Number(v1) / Number(v2);
            document.getElementById('total').innerHTML = result;
        }
    </script>

    <script>
        function Modulus() {
            let v1 = document.getElementById('v1').value;
            let v2 = document.getElementById('v2').value;
            console.log(v1,v2);

            let result = Number(v1) % Number(v2);
            document.getElementById('total').innerHTML = result;
        }
    </script>
</body>
</html>
